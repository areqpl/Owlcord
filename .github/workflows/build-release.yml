name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/wayland-health.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Install pacman build dependencies (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          pnpm package:dir
          pnpm package --linux pacman deb AppImage rpm --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: |
          pnpm package --win nsis zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.platform }}
          path: |
            dist/*.pacman
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
            dist/*.exe
            dist/*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-owlcord
          name: "Owlcord v${{ steps.ver.outputs.version }} (${{ steps.commit.outputs.date }})"
          body: |
            ## Owlcord v${{ steps.ver.outputs.version }}

            > Built from `areqpl/Owlcord@${{ steps.commit.outputs.sha }}` · ${{ steps.commit.outputs.date }}

            Upstream: [Vencord/Vesktop](https://github.com/Vencord/Vesktop) + [wayland-idle patch](https://github.com/T1mbits/Vesktop/tree/wayland-idle)

            ### What's included
            - ✅ **Owlcord branding** & native package name
            - ✅ All upstream features (Vencord preinstalled, screenshare)
            - ✅ **Wayland idle inhibition** — prevents screen dimming/locking during calls (Linux)
            - ✅ Wayland-optimized launcher flags (ozone, WaylandWindowDecorations, WebRTC PipeWire)
            - ✅ Universal multi-platform release (Linux & Windows)

            ### Install
            - **Arch / CachyOS**: `sudo pacman -U Owlcord-*.pacman` or `sudo pacman -U owlcord-*.pacman`
            - **Debian / Ubuntu**: `sudo dpkg -i owlcord-*.deb`
            - **Windows**: Run `Owlcord-Setup-*.exe` installer or extract portable `Owlcord-win-*.zip`
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
